   <g id="text_1">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="104.85" y="23.878828" transform="rotate(-0 104.85 23.878828)">SQL invalid or execution failed -&gt; ABSTAIN</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(49.905937 47.998008)">Plan ambiguous, item unavailable or</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(52.957031 55.199648)">plan-SQL fidelity failed -&gt; CLARIFY</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(31.125937 75.718008)">Score &gt;= 0.70 -&gt; ANSWER;  0.40-0.70 -&gt; WARN;</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(76.456406 82.91918)">&lt; 0.40 -&gt; ABSTAIN</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(36.549844 103.438008)">Any veto (coverage, audit, verifier, semantic)</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(54.315469 110.639648)">-&gt; CLARIFY, score capped at 0.30</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(40.703906 131.158008)">Standing caveat (inferred FK, related-table</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(51.479531 138.359648)">grain, stated assumption) -&gt; WARN</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(47.40375 158.878008)">The score is a weighted validity score,</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'" transform="translate(64.17375 166.079648)">not a calibrated probability</text>
   </g>
